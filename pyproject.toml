[project]
name = "hackaton-sante-numerique-2026"
version = "0.1.0"
description = "Hackathon on software mention extraction — Séminaire Santé Numérique 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "plotly",
    "jupyter",
    "ipykernel",
    "huggingface_hub",
    "pyarrow",
    "kaleido>=1.5.0",
]

[project.optional-dependencies]
# CoPaLink (scripts/copalink_client.py): uv sync --extra copalink
# nlstruct calls tokenizer.encode_plus, which transformers 5 removed; transformers 4.x
# in turn needs huggingface_hub < 1.0.
copalink = [
    "torch",
    "transformers==4.56.1",
    "nlstruct @ git+https://github.com/ClemenceS/nlstruct.git@f7fc39ebaf6bbb8255c692dca6d01ee9e727c898",
]

[tool.uv]
# This repo is a hackathon workspace, not an installable package.
package = false
